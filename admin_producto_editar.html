<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Administrador - Editar Producto</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/admin-form.css" />
  </head>
  <body>
    <header class="admin-header">
      <div>
        <a href="admin_home.html"><strong>MiTienda Admin</strong></a>
      </div>
      <nav>
        <a href="admin_home.html">Home</a
        ><a href="admin_productos.html">Productos</a
        ><a href="admin_usuarios.html">Usuarios</a
        ><a href="index.html">Tienda</a>
      </nav>
      <div class="admin-user-box">
        <span id="admin-user-name"></span>
        <a href="#" id="btn-logout-admin">Cerrar sesión</a>
      </div>
    </header>
    <main class="admin-main">
      <section class="form-card card">
        <h1>Editar producto</h1>
        <form id="productoForm">
          <div class="form-group">
            <label for="codigo">Código producto</label
            ><input id="codigo" required minlength="3" />
          </div>
          <div class="form-group">
            <label for="nombre">Nombre</label
            ><input id="nombre" required maxlength="100" />
          </div>
          <div class="form-group">
            <label for="descripcion">Descripción</label
            ><textarea id="descripcion" maxlength="500"></textarea>
          </div>
          <div class="form-group">
            <label for="precio">Precio</label
            ><input id="precio" type="number" min="0" step="0.01" required />
          </div>
          <div class="form-group">
            <label for="stock">Stock</label
            ><input id="stock" type="number" min="0" step="1" required />
          </div>
          <div class="form-group">
            <label for="stockCritico">Stock crítico</label
            ><input id="stockCritico" type="number" min="0" step="1" />
          </div>
          <div class="form-group">
            <label for="categoria">Categoría</label
            ><select id="categoria" required>
              <option value="tecnologia">Tecnología</option>
              <option value="accesorios">Accesorios</option>
              <option value="otros">Otros</option>
            </select>
          </div>
          <div class="actions">
            <button type="submit">Guardar cambios</button
            ><a class="btn btn-secondary" href="admin_productos.html"
              >Cancelar</a
            >
          </div>
          <p id="mensajeAdmin"></p>
        </form>
      </section>
    </main>
    <footer class="footer">
      <p>&copy; 2026 MiTienda - Todos los derechos reservados.</p>
    </footer>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
    <script>
      configurarProductoForm(true);
    </script>
  </body>
</html>
