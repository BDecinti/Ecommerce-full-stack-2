<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de Usuario</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/signup.css" />
  </head>

  <body>
    <header class="header">
      <div class="logo">
        <a href="index.html">
          <h2>MiTienda</h2>
        </a>
      </div>

      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="productos.html">Productos</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="blogs.html">Blogs</a>
        <a href="contacto.html">Contacto</a>
      </nav>

      <div class="user-menu">
        <a href="login.html" id="link-login">Iniciar sesión</a>
        <a href="signup.html" id="link-signup">Registrarse</a>
        <a href="carrito.html">🛒 Carrito (<span id="cart-count">0</span>)</a>
        <a href="admin_home.html" id="link-admin">⚙️ Admin</a>
        <span id="user-info-box" class="user-info-box"></span>
      </div>
    </header>

    <main>
      <section class="form-card card auth-card">
        <h1>Registro de Usuario</h1>
        <p class="muted">Crea una cuenta para comprar en la tienda.</p>

        <form id="signupForm">
          <div class="form-group">
            <label for="nombre">Nombre Completo</label>
            <input
              type="text"
              id="nombre"
              required
              maxlength="100"
              placeholder="Juan Pérez"
            />
          </div>

          <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input
              type="email"
              id="email"
              required
              maxlength="100"
              placeholder="correo@ejemplo.com"
            />
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input
              type="password"
              id="password"
              required
              minlength="4"
              maxlength="10"
              placeholder="••••••••"
            />
          </div>

          <div class="form-group">
            <label for="rol">Tipo de Usuario</label>
            <select id="rol">
              <option value="cliente">Cliente</option>
              <option value="admin">Administrador</option>
            </select>
          </div>

          <button type="submit">Registrarse</button>
        </form>

        <p id="mensajeSignup"></p>

        <p class="auth-link">
          ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
        </p>
      </section>
    </main>

    <footer class="footer">
      <p>&copy; 2026 MiTienda - Todos los derechos reservados.</p>
    </footer>

    <script src="js/auth.js"></script>
  </body>
</html>
