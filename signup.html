<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <main class="signup-container">
        <h2>Registro de Usuario</h2>

        <!-- Formulario de Registro -->
        <form id="signupForm">
            <div>
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" required placeholder="Juan Pérez">
            </div>

            <div>
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" required placeholder="correo@ejemplo.com">
            </div>

            <div>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <!-- Selector de Rol (Simulación para el proyecto) -->
            <div>
                <label for="rol">Tipo de Usuario:</label>
                <select id="rol">
                    <option value="cliente">Cliente</option>
                    <option value="admin">Administrador</option>
                </select>
            </div>

            <button type="submit">Registrarse</button>
        </form>

        <p id="mensajeSignup" style="color: green; margin-top: 10px;"></p>

        <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
    </main>

    <script src="js/auth.js"></script>
</body>
</html>
