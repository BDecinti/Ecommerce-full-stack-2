<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiTienda - Producto 3</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/producto-detalle.css" />
  </head>
  <body>
    <header class="header">
      <div class="logo">
        <a href="index.html"><h2>MiTienda</h2></a>
      </div>
      <nav class="nav-links">
        <a href="index.html">Home</a><a href="productos.html">Productos</a
        ><a href="nosotros.html">Nosotros</a><a href="blogs.html">Blogs</a
        ><a href="contacto.html">Contacto</a>
      </nav>
      <div class="user-menu">
        <a href="login.html" id="link-login">Iniciar sesión</a
        ><a href="signup.html" id="link-signup">Registrarse</a
        ><a href="carrito.html">🛒 Carrito (<span id="cart-count">0</span>)</a
        ><a href="admin_home.html" id="link-admin">⚙️ Admin</a
        ><span id="user-info-box" class="user-info-box"></span>
      </div>
    </header>
    <main>
      <section class="page-header"><h1>Detalle del producto</h1></section>
      <section class="container product-detail card">
        <img src="img/placeholder.svg" alt="Producto 3" />
        <div>
          <h2 id="detalle-nombre">Producto 3</h2>
          <p class="price" id="detalle-precio"></p>
          <p id="detalle-descripcion">
            Producto de ejemplo del catálogo de MiTienda. Revisa sus
            características antes de añadirlo al carrito.
          </p>
          <button onclick="agregarAlCarrito(3)">Añadir al carrito</button
          ><a class="btn btn-secondary" href="productos.html"
            >Volver a productos</a
          >
        </div>
      </section>
    </main>
    <footer class="footer">
      <p>&copy; 2026 MiTienda - Todos los derechos reservados.</p>
    </footer>
    <script src="js/productos.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const p = productos.find((x) => x.id === 3);
        if (p) {
          document.getElementById("detalle-nombre").textContent = p.nombre;
          document.getElementById("detalle-precio").textContent =
            "$" + p.precio.toLocaleString("es-CL");
        }
      });
    </script>
    <script src="js/auth.js"></script>
  </body>
</html>
