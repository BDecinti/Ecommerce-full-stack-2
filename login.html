<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <main class="login-container">
        <h2>Iniciar Sesión</h2>

        <!-- Formulario de Login -->
        <form id="loginForm">
            <div>
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" required placeholder="correo@ejemplo.com">
            </div>

            <div>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <button type="submit">Ingresar</button>
        </form>

        <!-- Elemento donde JS mostrará mensajes de error o bienvenida -->
        <p id="mensajeLogin" style="color: red; margin-top: 10px;"></p>

        <p>¿No tienes cuenta? <a href="signup.html">Regístrate aquí</a></p>
    </main>

    <!-- Script con la lógica de autenticación -->
    <script src="js/auth.js"></script>
</body>
</html>
