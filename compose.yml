services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mitienda
      POSTGRES_USER: mitienda
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tienda-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mitienda -d mitienda"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  tienda-db:
