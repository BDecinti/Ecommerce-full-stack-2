<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiTienda - Producto</title>
    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="../../css/producto-detalle.css" />
  </head>
  <body>
    <header class="header">
      <div class="logo">
        <a href="../../index.html"><h2>MiTienda</h2></a>
      </div>
      <nav class="nav-links">
        <a href="../../index.html">Home</a><a href="products.html">Productos</a
        ><a href="../company/about.html">Nosotros</a><a href="../blog/posts.html">Blogs</a
        ><a href="../company/contact.html">Contacto</a>
      </nav>
      <div class="user-menu">
        <a href="../auth/login.html" id="link-login">Iniciar sesión</a
        ><a href="../auth/signup.html" id="link-signup">Registrarse</a
        ><a href="../checkout/cart.html">🛒 Carrito (<span id="cart-count">0</span>)</a
        ><a href="../admin/dashboard.html" id="link-admin">⚙️ Admin</a
        ><span id="user-info-box" class="user-info-box"></span>
      </div>
    </header>
    <main>
      <section class="page-header"><h1>Detalle del producto</h1></section>
      <section class="container product-detail card">
        <img id="detalle-imagen" alt="" hidden />
        <div>
          <h2 id="detalle-nombre"></h2>
          <p class="price" id="detalle-precio"></p>
          <p id="detalle-descripcion"></p>
          <button id="detalle-agregar" type="button" hidden>Añadir al carrito</button
          ><a class="btn btn-secondary" href="products.html">Volver a productos</a>
        </div>
      </section>
    </main>
    <footer class="footer">
      <p>&copy; 2026 MiTienda - Todos los derechos reservados.</p>
    </footer>
    <script src="../../js/productos.js"></script>
    <script>
      // Esta página sirve para todos los productos: el producto a mostrar se elige
      // con el parámetro de la URL, por ejemplo product-detail.html?id=3
      document.addEventListener("DOMContentLoaded", () => {
        const id = Number(new URLSearchParams(location.search).get("id"));
        const p = productos.find((x) => x.id === id);

        if (!p) {
          document.getElementById("detalle-nombre").textContent = "Producto no encontrado";
          return;
        }

        document.title = "MiTienda - " + p.nombre;
        const img = document.getElementById("detalle-imagen");
        img.alt = p.nombre;
        img.onload = () => (img.hidden = false); // se muestra recién cuando terminó de cargar
        img.src = RAIZ_SITIO + p.imagen;
        document.getElementById("detalle-nombre").textContent = p.nombre;
        document.getElementById("detalle-precio").textContent =
          "$" + p.precio.toLocaleString("es-CL");
        document.getElementById("detalle-descripcion").textContent = p.descripcion;

        const boton = document.getElementById("detalle-agregar");
        boton.hidden = false;
        boton.addEventListener("click", () => agregarAlCarrito(p.id));
      });
    </script>
    <script src="../../js/auth.js"></script>
  </body>
</html>
