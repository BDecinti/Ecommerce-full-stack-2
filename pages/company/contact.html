<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiTienda - Contacto</title>
    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="../../css/contacto.css" />
  </head>
  <body>
    <header class="header">
      <div class="logo">
        <a href="../../index.html"><h2>MiTienda</h2></a>
      </div>
      <nav class="nav-links">
        <a href="../../index.html">Home</a><a href="../products/products.html">Productos</a
        ><a href="about.html">Nosotros</a><a href="../blog/posts.html">Blogs</a
        ><a href="contact.html">Contacto</a>
      </nav>
      <div class="user-menu">
        <a href="../auth/login.html" id="link-login">Iniciar sesión</a
        ><a href="../auth/signup.html" id="link-signup">Registrarse</a
        ><a href="../checkout/cart.html">🛒 Carrito (<span id="cart-count">0</span>)</a
        ><a href="../admin/dashboard.html" id="link-admin">⚙️ Admin</a
        ><span id="user-info-box" class="user-info-box"></span>
      </div>
    </header>
    <main>
      <section class="page-header">
        <h1>Contacto</h1>
        <p>Envíanos tu mensaje.</p>
      </section>
      <section class="form-card card">
        <form id="contactForm">
          <div class="form-group">
            <label for="nombre">Nombre</label
            ><input id="nombre" required maxlength="100" />
          </div>
          <div class="form-group">
            <label for="email">Correo</label
            ><input
              type="email"
              id="email"
              maxlength="100"
              placeholder="correo@ejemplo.com"
            />
          </div>
          <div class="form-group">
            <label for="comentario">Comentario</label
            ><textarea id="comentario" required maxlength="500"></textarea>
          </div>
          <button type="submit">Enviar mensaje</button>
          <p id="mensajeContacto"></p>
        </form>
      </section>
    </main>
    <footer class="footer">
      <p>&copy; 2026 MiTienda - Todos los derechos reservados.</p>
    </footer>
    <script src="../../js/contacto.js"></script>
    <script src="../../js/auth.js"></script>
  </body>
</html>
