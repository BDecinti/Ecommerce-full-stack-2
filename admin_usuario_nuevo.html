<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Administrador - Nuevo Usuario</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/admin-form.css" />
  </head>
  <body>
    <header class="admin-header">
      <div>
        <a href="admin_home.html"><strong>MiTienda Admin</strong></a>
      </div>
      <nav>
        <a href="admin_home.html">Home</a
        ><a href="admin_productos.html">Productos</a
        ><a href="admin_usuarios.html">Usuarios</a
        ><a href="index.html">Tienda</a>
      </nav>
      <div class="admin-user-box">
        <span id="admin-user-name"></span>
        <a href="#" id="btn-logout-admin">Cerrar sesión</a>
      </div>
    </header>
    <main class="admin-main">
      <section class="form-card card">
        <h1>Nuevo usuario</h1>
        <form id="usuarioForm">
          <div class="form-group">
            <label for="run">RUN</label
            ><input
              id="run"
              required
              minlength="7"
              maxlength="9"
              placeholder="19011022K"
            />
          </div>
          <div class="form-group">
            <label for="nombre">Nombre</label
            ><input id="nombre" required maxlength="50" />
          </div>
          <div class="form-group">
            <label for="apellidos">Apellidos</label
            ><input id="apellidos" required maxlength="100" />
          </div>
          <div class="form-group">
            <label for="email">Correo</label
            ><input id="email" type="email" required maxlength="100" />
          </div>
          <div class="form-group">
            <label for="fechaNacimiento">Fecha de nacimiento</label
            ><input id="fechaNacimiento" type="date" />
          </div>
          <div class="form-group">
            <label for="rol">Tipo de usuario</label
            ><select id="rol">
              <option value="admin">Administrador</option>
              <option value="vendedor">Vendedor</option>
              <option value="cliente">Cliente</option>
            </select>
          </div>
          <div class="form-group">
            <label for="region">Región</label
            ><select id="region">
              <option>Región Metropolitana</option>
              <option>Valparaíso</option>
              <option>Biobío</option>
              <option>La Araucanía</option>
            </select>
          </div>
          <div class="form-group">
            <label for="comuna">Comuna</label
            ><select id="comuna">
              <option>Santiago</option>
              <option>Maipú</option>
              <option>Puente Alto</option>
              <option>Providencia</option>
            </select>
          </div>
          <div class="form-group">
            <label for="direccion">Dirección</label
            ><input id="direccion" required maxlength="300" />
          </div>
          <div class="actions">
            <button type="submit">Crear usuario</button
            ><a class="btn btn-secondary" href="admin_usuarios.html"
              >Cancelar</a
            >
          </div>
          <p id="mensajeAdmin"></p>
        </form>
      </section>
    </main>
    <footer class="footer">
      <p>&copy; 2026 MiTienda - Todos los derechos reservados.</p>
    </footer>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
    <script>
      configurarUsuarioForm(false);
    </script>
  </body>
</html>
